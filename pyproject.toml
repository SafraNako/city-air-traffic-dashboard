[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-air-traffic-dashboard"
version = "0.1.0"
description = "Open-data dashboard for Istanbul air quality and traffic: the municipality's AQI reconstructed and checked, daily rhythm, weather-normalised trends, traffic and holiday effects, lockdowns as a natural experiment and city-wide PM10 episodes, each validated against planted truths or an independent source"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
sehir = "sehir_panosu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sehir_panosu = ["veri/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib",
    "ignore:.*parseAll.*:DeprecationWarning",
]
